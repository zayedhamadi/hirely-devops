apiVersion: apps/v1
kind: Deployment

metadata:
  name: config-service
  namespace: hirely
  labels:
    app: config-service
    component: backend

spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: config-service

  template:
    metadata:
      labels:
        app: config-service
        component: backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: config-service

          image: ghcr.io/zayedhamadi/config-service:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8888
              protocol: TCP

          envFrom:
            - configMapRef:
                name: config-service-config

          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spring-home-config
              mountPath: /home/spring/.config
      volumes:
        - name: tmp
          emptyDir: {}
        - name: spring-home-config
          emptyDir: {}

