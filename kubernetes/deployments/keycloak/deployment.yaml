apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: hirely

spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.5

          args:
            - start-dev
            - --import-realm

          ports:
            - containerPort: 8080
            - containerPort: 9000

          env:
            # Keycloak admin username
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: KEYCLOAK_ADMIN_USER

            # Keycloak is behind an Ingress / reverse proxy
            - name: KC_PROXY_HEADERS
              value: "xforwarded"

            # Public hostname (with port) so redirects/links are generated correctly
            - name: KC_HOSTNAME_URL
              value: "https://auth.hirely.local"

            - name: KC_HOSTNAME_STRICT
              value: "false"

            # Keycloak admin password
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: KEYCLOAK_ADMIN_PWD

            # Database
            - name: KC_DB
              value: "mysql"

            - name: KC_DB_URL
              value: "jdbc:mysql://mysql:3306/keycloak_db?createDatabaseIfNotExist=true"

            - name: KC_DB_USERNAME
              value: "root"

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            # Health and metrics
            - name: KC_HEALTH_ENABLED
              value: "true"

            - name: KC_METRICS_ENABLED
              value: "true"

            # Management port
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9000"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "750m"
              memory: "768Mi"

          volumeMounts:
            - name: keycloak-storage
              mountPath: /opt/keycloak/data

            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true

          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "HEAD /health/ready HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'

            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "HEAD /health/live HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'

            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: keycloak-storage
          persistentVolumeClaim:
            claimName: keycloak-pvc

        - name: realm-import
          configMap:
            name: keycloak-realm-import
