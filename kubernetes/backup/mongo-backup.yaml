apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  namespace: hirely
  # trivy:ignore:KSV-0118 -- ce job ecrit dans un hostPath (/var/backups/hirely)
  # appartenant a root:root ; passer en non-root empecherait l'ecriture du
  # backup. readOnlyRootFilesystem + capabilities drop ALL restent actifs.
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: backup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: vmonee
          containers:
            - name: backup
              image: mongo:7.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: mongodb-secret
              env:
                - name: HOME
                  value: /tmp
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  F=/backup/mongo-$(date +%F-%H%M).archive.gz
                  mongodump --host mongodb -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --archive=$F --gzip
                  test -s $F
                  chmod 644 $F
                  find /backup -name 'mongo-*.archive.gz' -mtime +7 -delete
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 300m, memory: 256Mi}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: backup
              hostPath:
                path: /var/backups/hirely
                type: DirectoryOrCreate
            - name: tmp
              emptyDir: {}
