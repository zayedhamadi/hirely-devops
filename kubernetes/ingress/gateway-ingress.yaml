apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: gateway-ingress
  namespace: hirely

  annotations:
    # Réécriture du chemin vers le Gateway
    nginx.ingress.kubernetes.io/rewrite-target: /$1

    # Support WebSocket / connexions longues
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # Taille maximale des fichiers envoyés
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

    # Évite la mise en cache des connexions WebSocket
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - api.hirely.local
      secretName: api-hirely-tls-secret

  rules:
    - host: api.hirely.local

      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific

            backend:
              service:
                name: gateway
                port:
                  number: 8080
