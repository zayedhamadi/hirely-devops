apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recrutement-service-allow-clients
  namespace: hirely
spec:
  podSelector:
    matchLabels:
      app: recrutement-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: frontend-service
        - podSelector:
            matchLabels:
              app: user-service
      ports:
        - protocol: TCP
          port: 8082
