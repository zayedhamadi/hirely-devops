apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: hirely
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      nodeSelector:
        kubernetes.io/hostname: vmtwo
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7.0
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          envFrom:
            - secretRef:
                name: mongodb-secret
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: 27017
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            failureThreshold: 6
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 27017
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mongodb-storage
          hostPath:
            path: /var/lib/rancher/k3s/storage/pvc-0e9fc8dd-8b43-4043-a1d7-c24b27baff6a_hirely_mongodb-pvc
            type: Directory
        - name: tmp
          emptyDir: {}
