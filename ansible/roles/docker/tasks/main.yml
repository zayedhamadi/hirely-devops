---
- name: Remove any existing conflicting Docker apt source (sources.list.d)
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Check if Docker source exists in main sources.list
  command: grep -l "download.docker.com" /etc/apt/sources.list
  register: docker_in_main_sources
  changed_when: false
  failed_when: false

- name: Remove Docker line from main sources.list if present
  lineinfile:
    path: /etc/apt/sources.list
    regexp: '.*download\.docker\.com.*'
    state: absent
  when: docker_in_main_sources.rc == 0

- name: Remove old docker-archive-keyring if present
  file:
    path: /usr/share/keyrings/docker-archive-keyring.gpg
    state: absent

- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add user to docker group
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: true
    state: started
